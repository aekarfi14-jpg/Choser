name: Build Choser APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set Choser launcher icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          convert public/assets/Sraha-launcher.jpg -resize 512x512^ -gravity center -extent 512x512 /tmp/choser-icon.png
          cp /tmp/choser-icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp /tmp/choser-icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp /tmp/choser-icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp /tmp/choser-icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp /tmp/choser-icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Choser.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Choser-APK
          path: Choser.apk
